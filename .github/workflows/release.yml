name: release

on:
  workflow_dispatch:

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-15]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: deps
        run: python -m pip install -U cibuildwheel==3.4.1 build pip wheel setuptools

      - name: sdist
        run: python -m build --sdist --outdir package
        if: matrix.os == 'ubuntu-latest'

      - name: wheels
        run: python -m cibuildwheel --output-dir package
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp313t-* cp314-* cp314t-*"
          CIBW_ENABLE: cpython-freethreading

      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.os }}
          path: package/*

  pyodide:
    name: Build pyodide
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: deps
        run: python -m pip install -U cibuildwheel==4.3.5

      - name: wheels
        run: python -m cibuildwheel --platform pyodide --output-dir package
        env:
          CIBW_BUILD: "cp314-*"

      - uses: actions/upload-artifact@v6
        with:
          name: package-pyodide
          path: package/*

  merge:
    name: Merge Artifacts
    runs-on: ubuntu-latest
    needs:
      - release
      - pyodide

    steps:
      - uses: actions/upload-artifact/merge@v6
        with:
          name: moderngl-6.0.0b3
          pattern: package-*
          delete-merged: true
