name: release

on:
  workflow_dispatch:

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: deps
        run: python -m pip install -U cibuildwheel build pip wheel setuptools

      - name: sdist
        run: python -m build --sdist --outdir package
        if: matrix.os == 'ubuntu-latest'

      - name: wheels
        run: python -m cibuildwheel --output-dir package
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.11"
          CIBW_ENABLE: cpython-freethreading
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: native

      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.os }}
          path: package/*

  pyodide:
    name: Build pyodide wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: deps
        run: python -m pip install -U cibuildwheel

      - name: wheels
        run: python -m cibuildwheel --platform pyodide --output-dir package

      - uses: actions/upload-artifact@v6
        with:
          name: package-pyodide
          path: package/*

  docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: build
        run: docker build . -f docs/Containerfile --target site -o site

      - uses: actions/upload-artifact@v6
        with:
          name: docs
          path: site

  merge:
    name: Merge Artifacts
    runs-on: ubuntu-latest
    needs:
      - release
      - pyodide
      - docs

    steps:
      - uses: actions/upload-artifact/merge@v6
        with:
          name: moderngl-6.0.0b1
          separate-directories: true
          delete-merged: true
