name: release

on:
  workflow_dispatch:

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: deps
        run: python -m pip install -U cibuildwheel build pip wheel setuptools

      - name: sdist
        run: python -m build --sdist --outdir package
        if: matrix.os == 'ubuntu-latest'

      - name: wheels
        run: python -m cibuildwheel --output-dir package
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp314t-*"
          CIBW_ARCHS: native

      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.os }}
          path: package/*

  merge:
    name: Merge Artifacts
    runs-on: ubuntu-latest
    needs:
      - release

    steps:
      - uses: actions/upload-artifact/merge@v6
        with:
          name: moderngl-6.0.0b2
          pattern: package-*
          delete-merged: true
